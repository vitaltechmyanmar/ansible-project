---
- name: Upgrade nginx to the latest available version
  hosts: webservers
  become: true

  vars:
    nginx_package: nginx
    backup_dir: /var/backups/nginx
    backup_timestamp: "{{ '%Y%m%d%H%M%S' | strftime }}"

  tasks:
    - name: Record nginx version before upgrade
      ansible.builtin.command: nginx -v
      register: nginx_old_version
      changed_when: false
      failed_when: false
      ignore_errors: true

    - name: Create config backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        mode: "0750"

    - name: Backup current nginx configuration
      ansible.builtin.command:
        cmd: "cp -a /etc/nginx {{ backup_dir }}/nginx-{{ backup_timestamp }}"
        creates: "{{ backup_dir }}/nginx-{{ backup_timestamp }}"

    - name: Update package index (apt-based)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.pkg_mgr == 'apt'

    - name: Upgrade nginx package
      ansible.builtin.package:
        name: "{{ nginx_package }}"
        state: latest

    - name: Record nginx version after upgrade
      ansible.builtin.command: nginx -v
      register: nginx_new_version
      changed_when: false
      failed_when: false

    - name: Test nginx configuration
      ansible.builtin.command: nginx -t
      register: nginx_test
      changed_when: false

    - name: Reload nginx with new binary
      ansible.builtin.service:
        name: nginx
        state: reloaded
      when: nginx_test.rc == 0

    - name: Fail on invalid nginx configuration
      ansible.builtin.fail:
        msg: "nginx -t failed. Config restored from {{ backup_dir }}/nginx-{{ backup_timestamp }}"
      when: nginx_test.rc != 0

    - name: Show upgrade result
      ansible.builtin.debug:
        msg: >-
          Host: {{ inventory_hostname }} |
          Old: {{ nginx_old_version.stderr | regex_search('nginx/[\\d.]+') | default('unknown') }} |
          New: {{ nginx_new_version.stderr | regex_search('nginx/[\\d.]+') | default('unknown') }} |
          Config backup: {{ backup_dir }}/nginx-{{ backup_timestamp }}